name: Build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o chaseke.zip -x '.github/*'
      - name: Version
        run: |
          sed -i '' "s/^Version:.*/Version: 0.1.${{ github.run_number }}/" control
      - name: Font
        run: |
          mkdir -p layout/Library/Chaseke
          cp tall.ttf layout/Library/Chaseke/
      - name: Deps
        run: brew install ldid dpkg
      - name: Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" packages/*.deb --title "Chaseke ${{ github.run_number }}" --notes "auto build"
